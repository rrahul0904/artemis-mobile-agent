[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis-mobile-agent"
version = "0.3.0"
description = "Autonomous Android mobile testing agent with trace-first verification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]
mcp = ["mcp>=2.2,<3"]

[project.scripts]
artemis-mobile = "artemis_mobile_agent.cli:app"
artemis-rebuild = "artemis_mobile_agent.cli:app"
artemis-mcp = "artemis_mobile_agent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["artemis_mobile_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
